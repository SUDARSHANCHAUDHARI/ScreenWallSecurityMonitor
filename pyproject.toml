[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenwallsecuritymonitor"
version = "1.0.0"
description = "Security auditing MVP for signage URLs, kiosk configurations, public playlists, CSP, and browser risks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
screenwall-monitor = "apps.api.app.cli:main"
